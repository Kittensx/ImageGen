<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>IMAGE_GEN WebUI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%231b9ddd%22/%3E%3Cpath d=%22M17 16h30v32H17zM23 22h18v20H23z%22 fill=%22white%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/css/tokens.css?v=0.1.40">
  <link rel="stylesheet" href="/assets/css/base.css?v=0.1.40">
  <link rel="stylesheet" href="/assets/css/layout.css?v=0.1.40">
  <link rel="stylesheet" href="/assets/css/components.css?v=0.1.63">
  <link rel="stylesheet" href="/assets/css/responsive.css?v=0.1.40">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <div class="brand-icon" aria-hidden="true">▧</div>
        <div>
          <h1>IMAGE_GEN</h1>
          <span class="version-label">WebUI <span id="appVersion">v0.1.0</span></span>
        </div>
      </div>
      <div class="worker-pill" id="workerPill">
        <span class="status-dot"></span>
        <strong>Worker</strong>
        <span id="workerText">Connecting…</span>
      </div>
      <nav class="top-actions" aria-label="Primary navigation">
        <button class="nav-button is-active" id="topGenerateButton" type="button">Generate</button>
        <button class="nav-button" id="topInfinityButton" type="button">∞ Generate</button>
        <button class="nav-button" id="topCancelButton" type="button">Cancel</button>
        <button class="nav-button" id="openOutputsButton" type="button">Outputs</button>
        <button class="nav-button" id="reloadWorkspaceButton" type="button">Reload UI</button>
        <button class="nav-button" id="openSettingsButton" type="button">Settings</button>
      </nav>
    </header>

    <main class="workspace" id="workspace">
      <div data-fragment="/assets/views/controls.html?v=0.1.63"></div>
      <div class="workspace-splitter" id="leftColumnSplitter" role="separator" aria-label="Resize generation controls" aria-orientation="vertical" tabindex="0"></div>
      <div data-fragment="/assets/views/preview.html?v=0.1.40"></div>
      <div class="workspace-splitter" id="rightColumnSplitter" role="separator" aria-label="Resize live preview and utilities" aria-orientation="vertical" tabindex="0"></div>
      <div data-fragment="/assets/views/utilities.html?v=0.1.62"></div>
    </main>

    <footer class="statusbar">
      <span>IMAGE_GEN WebUI</span>
      <span id="projectPath">Project: —</span>
      <span id="footerWorkerStatus">Worker: connecting</span>
      <span class="status-spacer"></span>
      <span class="theme-footer-controls" aria-label="Theme colors">
        <button type="button" class="theme-footer-button" id="accentThemeButton" title="Customize accent color">Sky Blue</button>
        <span aria-hidden="true">/</span>
        <button type="button" class="theme-footer-button" id="surfaceThemeButton" title="Customize surface color">Charcoal</button>
      </span>
    </footer>
  </div>

  <div data-fragment="/assets/views/overlays.html?v=0.1.59"></div>
  <script>
    (() => {
      const showBootFailure = (message) => {
        if (window.__IMAGE_GEN_BOOT_READY__) return;
        let notice = document.getElementById("webuiBootFailure");
        if (!notice) {
          notice = document.createElement("div");
          notice.id = "webuiBootFailure";
          notice.setAttribute("role", "alert");
          notice.style.cssText = "position:fixed;left:16px;right:16px;top:132px;z-index:99999;padding:16px 18px;border:2px solid #ff6b6b;border-radius:10px;background:#3b1118;color:#fff;font:600 14px/1.45 system-ui,sans-serif;box-shadow:0 10px 32px rgba(0,0,0,.45);white-space:pre-wrap";
          document.body.append(notice);
        }
        notice.textContent = `WebUI startup failed before the interface could mount.
${message || "Open the browser developer console and check the latest WebUI diagnostic bundle."}

Try Reload UI after applying the latest stability patch.`;
      };

      window.addEventListener("image-gen-boot-failed", (event) => {
        showBootFailure(event.detail?.message || "The startup module reported an error.");
      });
      window.addEventListener("error", (event) => {
        const source = String(event.filename || "");
        if (source.includes("/assets/js/") || !window.__IMAGE_GEN_BOOT_MODULE_LOADED__) {
          showBootFailure(event.message || `A required JavaScript module failed to load: ${source || "unknown module"}`);
        }
      });
      window.addEventListener("unhandledrejection", (event) => {
        showBootFailure(event.reason?.message || String(event.reason || "Unhandled startup promise rejection"));
      });
      window.setTimeout(() => {
        if (!window.__IMAGE_GEN_BOOT_READY__ && document.querySelector("[data-fragment]")) {
          const detail = window.__IMAGE_GEN_BOOT_ERROR__
            || (window.__IMAGE_GEN_BOOT_MODULE_LOADED__
              ? "The startup module loaded but did not finish mounting the interface."
              : "The main JavaScript module did not load. A syntax error or missing module is likely.");
          showBootFailure(detail);
        }
      }, 15000);
    })();
  </script>
  <script type="module" src="/assets/js/main.js?v=0.1.63"></script>
</body>
</html>
