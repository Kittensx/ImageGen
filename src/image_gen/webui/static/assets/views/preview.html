<section class="workspace-column center-column" id="outputBrowser" data-workspace-zone="center" aria-label="Main workspace column">
  <article class="panel output-viewer-panel" id="outputViewerPanel" data-panel-scale-key="output_viewer" data-workspace-panel="output_viewer" data-default-zone="center" data-workspace-protected="true">
    <div class="panel-heading output-viewer-heading">
      <div>
        <h2>Output Viewer</h2>
        <span id="outputDimensions">—</span>
      </div>
      <div class="viewer-actions ui-action-bar" id="outputViewerActionBar" data-action-bar data-action-bar-key="output-viewer" data-action-bar-hover="true" data-action-bar-overflow-label="More output viewer actions" aria-label="Output viewer controls">
        <button class="ui-action-button ui-icon-control" id="previousOutputButton" type="button" data-action-priority="72" data-action-group="navigation" aria-label="Previous output" title="Previous output"><span class="ui-icon" data-icon="chevron-left" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="nextOutputButton" type="button" data-action-priority="72" data-action-group="navigation" aria-label="Next output" title="Next output"><span class="ui-icon" data-icon="chevron-right" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control viewer-mode-button" id="fitOutputButton" type="button" data-action-priority="82" aria-pressed="true" aria-label="Fit output to panel" title="Fit output to panel"><span class="ui-icon" data-icon="fit-view" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control viewer-mode-button" id="imageDetailsButton" type="button" data-action-priority="58" aria-label="Image details" title="Image details" disabled><span class="ui-icon" data-icon="info" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control viewer-mode-button" id="openLargeOutputButton" type="button" data-action-priority="76" aria-label="Open large output" title="Open large output" disabled><span class="ui-icon" data-icon="maximize" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="output-stage is-fit" id="outputStage" tabindex="0" aria-label="Selected completed output">
      <div class="preview-placeholder" id="outputPlaceholder">
        <strong>No completed output selected</strong>
        <span>Generated images will remain available here while new jobs run.</span>
      </div>
      <img id="outputImage" alt="Selected completed output">
      <button class="output-timing-chip" id="outputTimingButton" type="button" aria-expanded="false" aria-controls="outputTimingPopover" title="Show image execution timing" hidden></button>
      <div class="output-timing-popover" id="outputTimingPopover" role="dialog" aria-label="Image execution timing" hidden></div>
    </div>
    <div class="preview-meta output-meta" id="outputMeta">
      <span>Sampler: <strong id="outputSampler">—</strong></span>
      <span>Scheduler: <strong id="outputScheduler">—</strong></span>
      <span>Seed: <strong id="outputSeed">—</strong></span>
      <span id="outputStatus">No selection</span>
    </div>
  </article>

  <div
    class="center-splitter"
    id="centerSplitter"
    role="separator"
    aria-label="Resize output viewer and recent outputs"
    aria-orientation="horizontal"
    tabindex="0"
    title="Drag to resize Recent Outputs. Double-click to reset its height."
  ></div>

  <article class="panel gallery-panel" id="recentOutputsPanel" data-panel-scale-key="recent_outputs" data-workspace-panel="recent_outputs" data-default-zone="center">
    <div class="panel-heading gallery-heading">
      <div>
        <h2>Recent Outputs</h2>
        <span class="gallery-selection-count" id="gallerySelectionCount" aria-live="polite">0 selected</span>
      </div>
      <div class="gallery-selection-actions ui-action-bar" id="recentOutputsActionBar" data-action-bar data-action-bar-key="recent-outputs" data-action-bar-hover="true" data-action-bar-overflow-label="More recent output actions" role="toolbar" aria-label="Recent output selection actions">
        <button class="ui-action-button ui-icon-control" id="selectAllVisibleButton" type="button" data-action-priority="52" data-action-group="selection" aria-label="Select all visible outputs" title="Select all visible outputs"><span class="ui-icon" data-icon="select-all" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="clearGallerySelectionButton" type="button" data-action-priority="46" data-action-group="selection" aria-label="Clear output selection" title="Clear output selection" disabled><span class="ui-icon" data-icon="selection-clear" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="clearRecentOutputsButton" type="button" data-action-priority="18" title="Clear the Recent Outputs list without deleting image files" aria-label="Clear recent output list" disabled><span class="ui-icon" data-icon="clear-finished" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="composeQueueButton" type="button" data-action-priority="94" aria-label="Compose queue from selected outputs" title="Compose queue from selected outputs" disabled><span class="ui-icon" data-icon="queue-compose" aria-hidden="true"></span><span class="ui-action-badge" id="composeQueueBadge" aria-hidden="true" hidden>0</span></button>
        <select class="compact-select" id="batchExportFormat" data-action-priority="30" data-action-group="transfer" aria-label="Queue export format">
          <option value="native">Native JSON</option>
          <option value="jsonl">JSON Lines</option>
          <option value="csv">CSV</option>
        </select>
        <button class="ui-action-button ui-icon-control" id="importQueueButton" type="button" data-action-priority="38" data-action-group="transfer" aria-label="Import queue" title="Import queue"><span class="ui-icon" data-icon="import" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="openVariationMatrixButton" type="button" data-action-priority="88" aria-label="Open Variation Matrix" title="Open Variation Matrix"><span class="ui-icon" data-icon="variation-matrix" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="exportCurrentButton" type="button" data-action-priority="42" data-action-group="transfer" aria-label="Export current output" title="Export current output"><span class="ui-icon" data-icon="export" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="exportSelectedOutputsButton" type="button" data-action-priority="48" data-action-group="transfer" aria-label="Export selected outputs" title="Export selected outputs" disabled><span class="ui-icon" data-icon="export-selection" aria-hidden="true"></span><span class="ui-action-badge" id="exportSelectedOutputsBadge" aria-hidden="true" hidden>0</span></button>
        <button class="ui-action-button ui-icon-control" id="recentOutputFilterToggleButton" type="button" data-action-priority="68" aria-label="Filter recent outputs" title="Filter recent outputs" aria-controls="recentOutputFilterPanel" aria-expanded="false"><span class="ui-icon" data-icon="filter" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="openOutputsButton" type="button" data-action-priority="34" aria-label="Open outputs folder" title="Open outputs folder"><span class="ui-icon" data-icon="folder-open" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="refreshOutputsButton" type="button" data-action-priority="80" aria-label="Refresh outputs" title="Refresh outputs"><span class="ui-icon" data-icon="refresh" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control" id="recentOutputReloadButton" type="button" data-action-priority="24" aria-label="Reload output folder" title="Reload output folder"><span class="ui-icon" data-icon="folder-reload" aria-hidden="true"></span></button>
        <button class="ui-action-button ui-icon-control panel-toggle" id="recentOutputsToggle" data-action-pinned="true" data-target="recentOutputsPanel" type="button" aria-label="Collapse recent outputs" title="Collapse recent outputs" aria-expanded="true"><span class="ui-icon" data-icon="chevron-up" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="recent-output-filter-panel" id="recentOutputFilterPanel" hidden>
      <div class="recent-output-filter-grid">
        <label>
          <span>Time window</span>
          <select id="recentOutputTimeWindow">
            <option value="72">72 hours</option>
            <option value="48">48 hours</option>
            <option value="24">24 hours</option>
            <option value="custom">Custom hours</option>
            <option value="all">All available</option>
          </select>
        </label>
        <label id="recentOutputCustomHoursWrap" hidden>
          <span>Custom hours</span>
          <input id="recentOutputCustomHours" type="number" min="1" step="1" value="24">
        </label>
        <label class="checkbox-field"><input id="recentOutputIncludeSubfolders" type="checkbox" checked> <span>Include subfolders</span></label>
        <label class="checkbox-field"><input id="recentOutputRequireMetadata" type="checkbox" checked> <span>External folders require supported metadata</span></label>
      </div>
      <div class="recent-output-source-block">
        <div class="recent-output-source-header">
          <strong>Image folders</strong>
          <small>Default source: <code id="recentOutputDefaultFolderPath">Current output folder</code></small>
        </div>
        <div class="recent-output-source-entry">
          <input id="recentOutputSourceInput" type="text" placeholder="Add another image folder path">
          <button class="secondary-button compact-button" id="addRecentOutputSourceButton" type="button">Add Folder</button>
        </div>
        <div class="recent-source-list" id="recentOutputSourceList"></div>
      </div>
      <div class="recent-output-filter-grid advanced-grid">
        <label>
          <span>Prompt filter</span>
          <input id="recentOutputPromptQuery" type="text" placeholder="comma, separated, prompt terms">
        </label>
        <label>
          <span>Custom start</span>
          <input id="recentOutputParserStart" type="text" placeholder="{">
        </label>
        <label>
          <span>Midpoint start</span>
          <input id="recentOutputParserMidpoint" type="text" placeholder=":::">
        </label>
        <label>
          <span>Custom end</span>
          <input id="recentOutputParserEnd" type="text" placeholder="}">
        </label>
      </div>
      <div class="recent-output-filter-grid advanced-grid">
        <label><span>Sampler</span><select id="recentOutputSamplerFilter"></select></label>
        <label><span>Scheduler</span><select id="recentOutputSchedulerFilter"></select></label>
        <label><span>Model</span><select id="recentOutputModelFilter"></select></label>
        <label><span>VAE</span><select id="recentOutputVaeFilter"></select></label>
        <label><span>LoRA</span><select id="recentOutputLoraFilter"></select></label>
        <label><span>Resolution</span><select id="recentOutputResolutionFilter"></select></label>
        <label><span>Mode</span><select id="recentOutputGenerationModeFilter"></select></label>
        <label><span>Hires</span><select id="recentOutputHiresFilter"></select></label>
        <label><span>Metadata source</span><select id="recentOutputMetadataSourceFilter"></select></label>
      </div>
      <div class="recent-output-filter-footer">
        <small id="recentOutputFilterSummary">0 shown of 0 scanned</small>
        <button class="ui-action-button ui-icon-control" id="resetRecentOutputFiltersButton" type="button" aria-label="Reset recent output filters" title="Reset recent output filters"><span class="ui-icon" data-icon="filter-reset" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="thumbnail-carousel" id="recentOutputCarousel" aria-label="Recent output pages">
      <button class="ui-action-button ui-icon-control carousel-nav-button" id="recentOutputCarouselPrevButton" type="button" aria-label="Show previous recent output page" title="Previous recent output page"><span class="ui-icon" data-icon="chevron-left" aria-hidden="true"></span></button>
      <div class="thumbnail-viewport" id="recentOutputCarouselViewport">
        <div class="thumbnail-strip" id="recentOutputs" role="list" aria-label="Recent output images"></div>
      </div>
      <button class="ui-action-button ui-icon-control carousel-nav-button" id="recentOutputCarouselNextButton" type="button" aria-label="Show next recent output page" title="Next recent output page"><span class="ui-icon" data-icon="chevron-right" aria-hidden="true"></span></button>
    </div>
    <div class="thumbnail-carousel-footer">
      <small id="recentOutputCarouselStatus">Showing 0–0 of 0 recent outputs</small>
    </div>
  </article>
</section>
